helmDefaults:
  verify: false
  wait: true
  kubeContext: kind-demo
  force: false
  timeout: 36000
  createNamespace: true
  cleanupOnFail: true

repositories:
- name: bytebase
  url: https://bytebase.github.io/bytebase
- name: bitnami
  url: registry-1.docker.io/bitnamicharts
  oci: true

releases:
  - name: postgres
    chart: bitnami/postgresql
    namespace: tools
    version: 18.1.8
    createNamespace: true
    values:
      - ./postgres.yaml
  - name: bytebase
    chart: bytebase/bytebase
    namespace: tools
    version: 1.1.1
    createNamespace: true
    values:
      - ./values.yaml