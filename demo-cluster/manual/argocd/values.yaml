    - name: HELM_PLUGINS
      value: /gitops-tools/helm-plugins/
    - name: HELM_SECRETS_CURL_PATH
      value: /gitops-tools/curl
    - name: HELM_SECRETS_SOPS_PATH
      value: /gitops-tools/sops
    - name: HELM_SECRETS_VALS_PATH
      value: /gitops-tools/vals
    - name: HELM_SECRETS_KUBECTL_PATH
      value: /gitops-tools/kubectl
    - name: HELM_SECRETS_BACKEND
      value: sops
    
    # Security settings
    - name: HELM_SECRETS_VALUES_ALLOW_SYMLINKS
      value: "false"
    - name: HELM_SECRETS_VALUES_ALLOW_ABSOLUTE_PATH
      value: "true"
    - name: HELM_SECRETS_VALUES_ALLOW_PATH_TRAVERSAL
      value: "false"
    - name: HELM_SECRETS_WRAPPER_ENABLED
      value: "true"
    - name: HELM_SECRETS_DECRYPT_SECRETS_IN_TMP_DIR
      value: "true"
    - name: HELM_SECRETS_HELM_PATH
      value: /usr/local/bin/helm
  
  # Volumes
  volumes:
    - name: gitops-tools
      emptyDir: {}
  
  volumeMounts:
    - mountPath: /gitops-tools
      name: gitops-tools
    - mountPath: /usr/local/sbin/helm
      subPath: helm
      name: gitops-tools
  
  # Fixed init container with curl instead of wget
  initContainers:
    - name: download-tools
      image: alpine:latest
      imagePullPolicy: IfNotPresent
      command: [sh, -ec]
      env:
        - name: HELM_SECRETS_VERSION
          value: "4.6.11"
        - name: KUBECTL_VERSION
          value: "1.31.0"
        - name: VALS_VERSION
          value: "0.42.0"
        - name: SOPS_VERSION
          value: "3.9.1"
      args:
        - |
          set -e
          
          # Install curl (Alpine needs this explicitly)
          apk add --no-cache curl tar gzip
          
          mkdir -p /gitops-tools/helm-plugins
          cd /gitops-tools
          
          # Hardcode architecture to avoid Windows issues
          ARCH=amd64
          
          echo "Downloading curl binary..."
          curl -sSfL -o curl https://github.com/moparisthebest/static-curl/releases/latest/download/curl-${ARCH}
          chmod +x curl
          
          echo "Downloading kubectl..."
          curl -sSfL -o kubectl https://dl.k8s.io/release/v${KUBECTL_VERSION}/bin/linux/${ARCH}/kubectl
          chmod +x kubectl
          
          echo "Downloading SOPS..."
          curl -sSfL -o sops https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.${ARCH}
          chmod +x sops
          
          echo "Downloading VALS..."
          curl -sSfL https://github.com/helmfile/vals/releases/download/v${VALS_VERSION}/vals_${VALS_VERSION}_linux_${ARCH}.tar.gz | tar -xz vals
          chmod +x vals
          
          echo "Downloading helm-secrets plugin..."
          curl -sSfL https://github.com/jkroepke/helm-secrets/releases/download/v${HELM_SECRETS_VERSION}/helm-secrets.tar.gz | tar -xz -C helm-plugins
          
          echo "Creating helm wrapper..."
          cp helm-plugins/helm-secrets/scripts/wrapper/helm.sh ./helm
          chmod +x helm
          
          echo "✅ All tools installed successfully!"
          ls -lah /gitops-tools/
      
      volumeMounts:
        - mountPath: /gitops-tools
          name: gitops-tools

    
    # KIND: No annotations needed (uses local AWS credentials)
    # EKS: Needs IRSA annotation for KMS access
    # annotations:
    #   eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/argocd-sops-role"  # EKS
  
  # Resource limits
  resources:
    limits:
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

# -----------------------------------------------------------------------------
# APPLICATION SET CONTROLLER
# -----------------------------------------------------------------------------
applicationSet:
  enabled: true
  replicas: 1
  
  tolerations:
    - key: "CriticalAddonsOnly"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
  
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: observability

dex:
  enabled: true
  tolerations:
    - key: "CriticalAddonsOnly"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"

notifications:
  enabled: true
  tolerations:
    - key: "CriticalAddonsOnly"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"

# =============================================================================
# MIGRATION NOTES (Kind → EKS)
# =============================================================================
#
# When moving from Kind to EKS, change:
# 1. global.domain: argocd.localhost → argocd.ymishkhas.cloud
# 2. configs.cm.url: https://argocd.localhost → https://argocd.ymishkhas.cloud
# 3. redis.enabled: true → false
# 4. redis-ha.enabled: false → true (if wanting HA)
# 5. server.replicas: 1 → 2
# 6. repoServer.replicas: 1 → 2
# 7. repoServer.serviceAccount.annotations: Uncomment IRSA role
#
# =============================================================================