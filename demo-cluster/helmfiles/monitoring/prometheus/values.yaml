# CRDs for Prometheus Operator (ServiceMonitor, PrometheusRule, etc.)
crds:
  enabled: true

# Prometheus server configuration
prometheus:
  enabled: true
  
  prometheusSpec:
    retention: 7d    
    replicas: 1
    resources:
      limits:
        memory: 1Gi
      requests:
        cpu: 250m
        memory: 512Mi
    
    # Storage (disabled for Kind, enable for EKS)
    storageSpec: {}
    # EKS: Uncomment this
    # storageSpec:
    #   volumeClaimTemplate:
    #     spec:
    #       storageClassName: gp3
    #       accessModes: ["ReadWriteOnce"]
    #       resources:
    #         requests:
    #           storage: 30Gi
    
    # Which PrometheusRules to watch (must match ArgoCD label)
    ruleSelector:
      matchLabels:
        release: observability
    
    # Which ServiceMonitors to watch
    serviceMonitorSelector:
      matchLabels:
        release: observability

# Prometheus Operator (manages Prometheus CRDs)
prometheusOperator:
  enabled: true

# Grafana (covered in separate file)
grafana:
  enabled: true

# AlertManager (covered in separate file)
alertmanager:
  enabled: true

# Node Exporter (collects host-level metrics: CPU, memory, disk)
nodeExporter:
  enabled: true

prometheus-node-exporter:
  prometheus:
    monitor:
      enabled: true
      additionalLabels:
        release: observability

# Kube State Metrics (Kubernetes object metrics: pods, deployments, etc.)
kubeStateMetrics:
  enabled: true

kube-state-metrics:
  prometheus:
    monitor:
      enabled: true
      additionalLabels:
        release: observability

# Kubernetes component monitoring
kubeApiServer:
  enabled: true
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: observability

kubelet:
  enabled: true
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: observability

kubeControllerManager:
  enabled: false  # Not accessible in Kind/EKS

kubeScheduler:
  enabled: false  # Not accessible in Kind/EKS

kubeProxy:
  enabled: true
  service:
    enabled: true
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: observability

coreDns:
  enabled: true
  service:
    enabled: true
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: observability