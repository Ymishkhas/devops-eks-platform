aws-load-balancer-controller:
  region: us-east-1
  clusterName: eks-techrar-demo
  defaultTargetType: ip
  enableShield: false
  enableWaf: false
  enableWafv2: false
  podLabels:
    cost-center: aws-alb-load-balancer-controller
    sub-unit: aws-alb-load-balancer-controller
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 80

  serviceAccount:
    create: true
    name: aws-load-balancer-controller  # Must match Terraform
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::412514615512:role/eks-sa-alb-demo

  rbac:
    create: true

  terminationGracePeriodSeconds: 10

  resources:
    requests:
      cpu: 50m
      memory: 100Mi
    limits:
      memory: 300Mi

  tolerations:
    - key: "CriticalAddonsOnly"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"

  logLevel: info

  enableServiceMutatorWebhook: false  # ref: https://github.com/kubernetes-sigs/aws-load-balancer-controller/releases/tag/v2.5.1

  env:
    # ENV_1: ""

  serviceMonitor:
    enabled: false
    additionalLabels:
      release: observability
    interval: 1m
